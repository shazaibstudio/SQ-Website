<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shazaib Qaiser 3D Portfolio</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        button {
            background: cyan;
            border: none;
            padding: 12px 20px;
            margin-right: 10px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 20px cyan;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/examples/jsm/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>

</head>
<body>

    <div class="ui">
        <button id="start-btn">Ignition</button>
        <button id="stop-btn">Stop</button>
    </div>

    <!-- THIS MUST EXIST -->
    <canvas id="portfolio-canvas"></canvas>

    <!-- THIS MUST BE type="module" -->
    <script type="module" src="./js/main.js"></script>

</body>
</html>
